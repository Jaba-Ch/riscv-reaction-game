<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- C host -->
  <rect x="20" y="60" width="200" height="300" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">C Host</text>
    <g fill="#ffffff" stroke="#64748b" stroke-width="1.2">
    <rect x="40" y="100" width="160" height="44" rx="8"/>
    <rect x="40" y="170" width="160" height="44" rx="8"/>
    <rect x="40" y="270" width="160" height="44" rx="8"/>
  </g>
  <g font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="120" y="127">Keyboard input</text>
    <text x="120" y="190">Microsecond timer</text>
    <text x="120" y="297">Console output</text>
  </g>
  <text x="120" y="205" text-anchor="middle" font-size="10" fill="#64748b">QueryPerformanceCounter</text>
  <path d="M120 144 V168" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- Datapath -->
  <rect x="340" y="60" width="640" height="300" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="660" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">RISC-V Datapath Model (RV32I)</text>
  <g fill="#ffffff" stroke="#3b82f6" stroke-width="1.2">
    <rect x="360" y="162" width="130" height="60" rx="8"/>
    <rect x="530" y="162" width="180" height="60" rx="8"/>
    <rect x="750" y="162" width="110" height="60" rx="8"/>
    <rect x="530" y="262" width="180" height="60" rx="8"/>
    <rect x="750" y="262" width="190" height="60" rx="8"/>
  </g>
  <g font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="425" y="188">32-bit</text>
    <text x="425" y="205">instruction</text>
    <text x="620" y="185">Control &amp; Decode</text>
    <text x="805" y="185">ALU</text>
    <text x="620" y="289">Register File</text>
    <text x="845" y="289">Data Memory</text>
  </g>
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="620" y="203" font-size="9">Main_decode · Extend · ALU_decode</text>
    <text x="805" y="203" font-size="9">ADD SUB SLT OR AND</text>
    <text x="620" y="306">x0 – x31</text>
    <text x="845" y="306">memory-mapped 0x2000 – 0x200C</text>
  </g>

  <!-- arrows inside datapath -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M490 192 H528" marker-end="url(#a)"/>
    <path d="M710 192 H748" marker-end="url(#a)"/>
    <path d="M620 260 V242 H780 V224" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M835 224 V260" marker-end="url(#a)"/>
    <path d="M748 292 H712" marker-end="url(#a)"/>
  </g>

  <!-- host <-> datapath -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M200 192 H358" marker-end="url(#a)"/>
    <path d="M845 322 V345 H120 V316" marker-end="url(#a)"/>
  </g>
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="280" y="170">instruction +</text>
    <text x="280" y="183">reaction time (µs)</text>
    <text x="500" y="338">comparison result (0x2008)</text>
  </g>
</svg>
